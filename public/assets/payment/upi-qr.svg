<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" rx="24" fill="#ffffff"/>
  <!-- Decorative border -->
  <rect x="12" y="12" width="296" height="296" rx="16" fill="none" stroke="#00C853" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Header with UPI icon -->
  <rect x="24" y="24" width="272" height="42" rx="10" fill="#0b0f19"/>
  <text x="160" y="49" fill="#00C853" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="1">⚡ BHIM • UPI SECURE SCAN</text>
  
  <!-- QR Code Matrix Graphic -->
  <g transform="translate(48, 80)">
    <!-- Top-Left Target -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#111827"/>
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="20" y="20" width="20" height="20" rx="2" fill="#00C853"/>
    
    <!-- Top-Right Target -->
    <rect x="164" y="0" width="60" height="60" rx="8" fill="#111827"/>
    <rect x="174" y="10" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="184" y="20" width="20" height="20" rx="2" fill="#00C853"/>
    
    <!-- Bottom-Left Target -->
    <rect x="0" y="104" width="60" height="60" rx="8" fill="#111827"/>
    <rect x="10" y="114" width="40" height="40" rx="4" fill="#ffffff"/>
    <rect x="20" y="124" width="20" height="20" rx="2" fill="#00C853"/>
    
    <!-- Pattern Pixels -->
    <rect x="80" y="0" width="16" height="16" fill="#111827"/>
    <rect x="112" y="0" width="32" height="16" fill="#111827"/>
    <rect x="80" y="24" width="24" height="24" fill="#111827"/>
    <rect x="120" y="24" width="20" height="20" fill="#111827"/>
    <rect x="80" y="56" width="16" height="16" fill="#111827"/>
    <rect x="108" y="56" width="36" height="16" fill="#111827"/>
    
    <rect x="0" y="72" width="24" height="16" fill="#111827"/>
    <rect x="36" y="72" width="24" height="16" fill="#111827"/>
    <rect x="164" y="72" width="24" height="16" fill="#111827"/>
    <rect x="200" y="72" width="24" height="16" fill="#111827"/>
    
    <rect x="80" y="84" width="64" height="32" rx="4" fill="#00C853"/>
    <text x="112" y="104" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">PAY</text>
    
    <rect x="80" y="128" width="24" height="16" fill="#111827"/>
    <rect x="120" y="128" width="40" height="16" fill="#111827"/>
    <rect x="176" y="104" width="24" height="24" fill="#111827"/>
    <rect x="208" y="120" width="16" height="44" fill="#111827"/>
    <rect x="80" y="152" width="48" height="12" fill="#111827"/>
    <rect x="144" y="152" width="48" height="12" fill="#111827"/>
  </g>
  
  <!-- Footer Brand -->
  <rect x="24" y="260" width="272" height="36" rx="8" fill="#f3f4f6"/>
  <text x="160" y="283" fill="#1f2937" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    GPay • PhonePe • Paytm • Any UPI
  </text>
</svg>
