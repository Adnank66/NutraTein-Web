<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Protein Intake Calculator | NUTRATEIN</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">N</div>
        NUTRA<span>TEIN</span>
      </a>
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link" data-i18n="nav_home">Home</a>
        <a href="shop.html" class="nav-link" data-i18n="nav_shop">Shop</a>
        <a href="build-stack.html" class="nav-link" data-i18n="nav_build_stack">Build Stack</a>
        <a href="compare.html" class="nav-link" data-i18n="nav_compare">Compare</a>
        <a href="calculator.html" class="nav-link active" data-i18n="nav_calculator">Calculator</a>
        <a href="tracking.html" class="nav-link" data-i18n="nav_track_order">Track Order</a>
        <a href="about.html" class="nav-link" data-i18n="nav_about">About</a>
        <a href="contact.html" class="nav-link" data-i18n="nav_contact">Contact</a>
      </nav>
      <div class="header-actions">
        <!-- Language Selector -->
        <div class="lang-selector-wrap">
          <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)" aria-label="Select Language">
            <option value="en">EN</option>
            <option value="hi">हिन्दी</option>
            <option value="mr">मराठी</option>
          </select>
        </div>
        <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()"></button>
        <button class="header-action-btn" onclick="openCartDrawer()" title="Cart">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg>
          <span class="action-badge cart-badge" style="display: none;">0</span>
        </button>
        <a href="login.html" class="btn btn-primary btn-sm guest-required-nav" data-i18n="nav_sign_in">Sign In</a>
      </div>
    </div>
  </header>

  <section class="section" style="padding-top: 24px;">
    <div class="container" style="max-width: 720px;">
      <div class="page-nav-bar">
        <button onclick="goBack()" class="btn-nav-back" title="Go back to previous page">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
          <span data-i18n="nav_back">Back</span>
        </button>
        <a href="index.html" class="btn-nav-home" title="Return to homepage">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span data-i18n="nav_home">Home</span>
        </a>
      </div>

      <div class="breadcrumb">
        <a href="index.html" data-i18n="nav_home">Home</a>
        <span class="breadcrumb-sep">/</span>
        <span data-i18n="nav_calculator">Protein Calculator</span>
      </div>

      <div class="section-header center">
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 6px;">Daily Protein Intake Calculator</h1>
        <p class="section-subtitle">Calculate the scientifically validated protein grams your muscles need based on body composition and training volume</p>
      </div>

      <div class="card" style="padding: 32px;">
        <form onsubmit="calculateProtein(event)">
          <div class="form-group">
            <label class="form-label">Body Weight (kg)</label>
            <input type="number" id="calc-weight" class="form-control" value="70" min="30" max="200" required>
          </div>

          <div class="form-group">
            <label class="form-label">Activity & Training Frequency</label>
            <select id="calc-activity" class="form-control">
              <option value="sedentary">Sedentary (Little or no exercise)</option>
              <option value="moderate" selected>Moderate (3-4 gym workouts/week)</option>
              <option value="active">Heavy Athlete (5-7 intense training sessions/week)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Primary Fitness Goal</label>
            <select id="calc-goal" class="form-control">
              <option value="muscle_gain" selected>Hypertrophy / Lean Muscle Building</option>
              <option value="fat_loss">Fat Loss / Cutting (Maintain Lean Mass)</option>
              <option value="maintain">General Fitness Maintenance</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary w-full btn-lg mt-2">Calculate Daily Requirement</button>
        </form>

        <div id="calc-result" style="margin-top: 28px;"></div>
      </div>
    </div>
  </section>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCartDrawer()"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-drawer-header">
      <h3 style="font-size: 1.15rem; font-weight: 800;">Shopping Cart</h3>
      <button onclick="closeCartDrawer()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>
    <div class="cart-drawer-body" id="cart-drawer-items"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/interactive.js"></script>
  <script src="js/ai-chat.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => calculateProtein());
  </script>
</body>
</html>
