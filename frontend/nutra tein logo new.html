    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #ededed; color: #05090a; }
    main { width: min(960px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; }
    p { margin: 0 0 24px; color: #4b5563; }
    .previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { min-height: 220px; padding: 32px; display: grid; place-items: center; border-radius: 16px; }
    .card.light { background: #fff; }
    .card.dark { background: #05090a; }
    .logo { width: min(100%, 420px); aspect-ratio: 302 / 142; display: block; background: var(--nutratein-logo) center / contain no-repeat; }
    .logo.white { filter: invert(1); }
    code { background: #d9dce1; padding: 2px 5px; border-radius: 4px; }
  </style>

  <main>
    <h1>NutraTein Logo</h1>
    <p>Use <code>assets/nutratein-logo.png</code>. It has a transparent background.</p>

      <section class="card light" aria-label="Black logo on white"><span class="logo" role="img" aria-label="NutraTein"></span></section>
      <section class="card dark" aria-label="White logo on black"><span class="logo white" role="img" aria-label="NutraTein"></span></section>
    </div>
  </main>
