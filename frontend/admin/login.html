<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NUTRATEIN</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-2); padding: 24px; }
    .admin-login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
    .admin-login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center; }
    .admin-login-logo .logo-icon { width: 40px; height: 40px; font-size: 1rem; }
    .admin-login-logo .logo-text { font-size: 1.4rem; font-weight: 900; letter-spacing: 0.05em; color: var(--text-primary); }
    .admin-login-logo .logo-text span { color: var(--brand); }
    .admin-badge { background: var(--brand); color: #fff; font-size: 0.65rem; font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.05em; margin-left: 8px; }
    .admin-login-title { font-size: 1.3rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .admin-login-sub { color: var(--text-muted); font-size: 0.85rem; text-align: center; margin-bottom: 32px; }
    .login-form .form-group { margin-bottom: 18px; }
    .login-form .form-label { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block; }
    .login-form .form-control { width: 100%; padding: 12px 14px; font-size: 0.95rem; border-radius: 10px; box-sizing: border-box; }
    .login-submit-btn { width: 100%; padding: 13px; font-size: 1rem; font-weight: 700; border-radius: 10px; margin-top: 8px; cursor: pointer; border: none; background: var(--brand); color: #fff; transition: all 0.2s; }
    .login-submit-btn:hover { background: var(--brand-dark, #b84e10); transform: translateY(-1px); }
    .login-submit-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .login-error { background: rgba(220,38,38,0.1); border: 1px solid rgba(220,38,38,0.3); color: #dc2626; border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; margin-bottom: 16px; display: none; }
    .login-footer-link { text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--text-muted); }
    .login-footer-link a { color: var(--brand); text-decoration: none; font-weight: 600; }
    .login-footer-link a:hover { text-decoration: underline; }
    .password-wrapper { position: relative; }
    .password-wrapper .form-control { padding-right: 42px; }
    .password-eye { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 1.1rem; padding: 0; display: flex; align-items: center; }
    .theme-toggle-corner { position: fixed; top: 16px; right: 16px; z-index: 100; }
    @media(max-width: 480px) {
      .admin-login-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle-btn theme-toggle-corner" id="theme-toggle-btn" onclick="toggleTheme()"></button>

  <div class="admin-login-card">
    <div class="admin-login-logo">
      <div class="logo-icon">N</div>
      <span class="logo-text">NUTRA<span>TEIN</span></span>
      <span class="admin-badge">ADMIN</span>
    </div>

    <h1 class="admin-login-title">Admin Portal</h1>
    <p class="admin-login-sub">Sign in with your administrator credentials to access the control panel.</p>

    <div class="login-error" id="login-error"></div>

    <form class="login-form" onsubmit="handleAdminLogin(event)">
      <div class="form-group">
        <label class="form-label" for="admin-email">Email Address</label>
        <input type="email" id="admin-email" class="form-control" placeholder="kaziadnan275@gmail.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="admin-password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="admin-password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
          <button type="button" class="password-eye" onclick="togglePasswordVisibility()" title="Show/hide password">👁️</button>
        </div>
      </div>
      <button type="submit" class="login-submit-btn" id="login-btn">🔐 Sign In to Admin</button>
      <button type="button" onclick="fillDemoAdmin()" style="width: 100%; margin-top: 10px; padding: 10px; background: var(--bg-2); border: 1px dashed var(--border); border-radius: 10px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; transition: all 0.2s;">
        ⚡ Auto-Fill Demo Admin (kaziadnan275@gmail.com / Admin@123)
      </button>
    </form>

    <div class="login-footer-link">
      <a href="../index.html">← Back to Store</a>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../config/siteContent.js"></script>
  <script src="../js/common.js"></script>
  <script>
    // Initialize theme on load
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      // If already logged in as admin, redirect immediately
      const token = getToken();
      const user = getUser();
      if (token && user && user.role === 'admin') {
        const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
        window.location.href = redirectTo;
      }
    });

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn = document.getElementById('login-btn');
      const errorDiv = document.getElementById('login-error');

      errorDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const base = window.API_BASE || '/api';
        const res = await fetch(`${base}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success && data.user && data.user.role === 'admin') {
          // Store auth
          localStorage.setItem('proteinx_token', data.token);
          localStorage.setItem('proteinx_user', JSON.stringify(data.user));
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          const redirectTo = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
          window.location.href = redirectTo;
        } else if (data.success && data.user && data.user.role !== 'admin') {
          showLoginError('This account does not have administrator access.');
        } else {
          showLoginError(data.message || 'Invalid email or password.');
        }
      } catch (err) {
        showLoginError('Unable to connect to server. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = '🔐 Sign In to Admin';
      }
    }

    function showLoginError(msg) {
      const errorDiv = document.getElementById('login-error');
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('admin-password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function fillDemoAdmin() {
      document.getElementById('admin-email').value = 'kaziadnan275@gmail.com';
      document.getElementById('admin-password').value = 'Admin@123';
      const err = document.getElementById('login-error');
      if (err) err.style.display = 'none';
    }
  </script>
</body>
</html>
