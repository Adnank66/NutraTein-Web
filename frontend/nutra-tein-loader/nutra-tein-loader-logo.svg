<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 88" role="img" aria-labelledby="title">
  <title id="title">Nutra Tein</title>
  <style>
    .nt-mark, .nt-letter { transform-box: fill-box; transform-origin: 50% 50%; }
    .nt-mark { opacity: 0; animation: nt-mark-in 280ms cubic-bezier(.16,1,.3,1) 30ms both; }
    .nt-letter { opacity: 0; animation: nt-letter-expand 390ms cubic-bezier(.16,1,.3,1) var(--delay) both; }
    @keyframes nt-mark-in {
      from { opacity: 0; transform: scale(.72); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes nt-letter-expand {
      0% { opacity: 0; transform: translateX(var(--from)) scale(.32); }
      32% { opacity: 1; }
      76% { opacity: 1; transform: translateX(-2px) scale(1.12); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nt-mark, .nt-letter { animation-duration: 1ms !important; animation-delay: 0ms !important; }
    }
  </style>
  <g class="nt-mark">
    <rect x="1" y="1" width="86" height="86" rx="19" fill="#141414" stroke="#2b2b2b" stroke-width="2"/>
    <path d="M29 61 41 26h10L42 61H29Zm19-18 5-15h10L52 61H42l6-18Z" fill="#ff5a1f"/>
  </g>
  <!-- Letters expand from the middle, matching the uploaded reference effect. -->
  <text class="nt-letter" style="--from: 150px; --delay: 0ms" x="110" y="60" fill="#f7f7f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">N</text>
  <text class="nt-letter" style="--from: 121px; --delay: 22ms" x="138" y="60" fill="#f7f7f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">U</text>
  <text class="nt-letter" style="--from: 92px; --delay: 44ms" x="166" y="60" fill="#f7f7f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">T</text>
  <text class="nt-letter" style="--from: 68px; --delay: 66ms" x="190" y="60" fill="#f7f7f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">R</text>
  <text class="nt-letter" style="--from: 42px; --delay: 88ms" x="218" y="60" fill="#f7f7f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">A</text>
  <text class="nt-letter" style="--from: -34px; --delay: 110ms" x="296" y="60" fill="#ff5a1f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">T</text>
  <text class="nt-letter" style="--from: -58px; --delay: 132ms" x="320" y="60" fill="#ff5a1f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">E</text>
  <text class="nt-letter" style="--from: -82px; --delay: 154ms" x="344" y="60" fill="#ff5a1f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">I</text>
  <text class="nt-letter" style="--from: -94px; --delay: 176ms" x="358" y="60" fill="#ff5a1f" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">N</text>
</svg>
