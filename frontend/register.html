<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | NUTRATEIN</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--bg-2);">

  <div class="auth-page">
    <div class="auth-card" style="max-width: 480px;">
      <div class="auth-logo">
        <a href="index.html" class="logo" style="justify-content: center;">
          <div class="logo-icon">N</div>
          NUTRA<span>TEIN</span>
        </a>
      </div>

      <h1 class="auth-title">Create an Account</h1>
      <p class="auth-subtitle">Join the fitness nutrition community</p>

      <div id="reg-alert" class="hidden" style="padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.85rem; font-weight: 500;"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Aman Sharma" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="aman@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210">
        </div>

        <div class="form-group">
          <label class="form-label">Password (min. 6 characters) *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
        </div>

        <button type="submit" id="reg-submit-btn" class="btn btn-primary w-full btn-lg mt-2">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" style="font-weight: 700;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="config/siteContent.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;
      const alertEl = document.getElementById('reg-alert');
      const btn = document.getElementById('reg-submit-btn');

      if (password !== confirmPassword) {
        alertEl.textContent = 'Passwords do not match';
        alertEl.style.background = '#FEE2E2';
        alertEl.style.color = '#991B1B';
        alertEl.classList.remove('hidden');
        return;
      }

      alertEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width: 18px; height: 18px;"></div> Registering...';

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });
        const data = await res.json();

        if (data.success) {
          setAuth(data.token, data.user);
          showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 800);
        } else {
          alertEl.textContent = data.message || 'Registration failed';
          alertEl.style.background = '#FEE2E2';
          alertEl.style.color = '#991B1B';
          alertEl.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch {
        alertEl.textContent = 'Server connection failed';
        alertEl.style.background = '#FEE2E2';
        alertEl.style.color = '#991B1B';
        alertEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
